<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <title>Navbatchi</title>
  <link rel="stylesheet" href="app.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <main id="screen" class="screen"></main>
  <nav id="tabs" class="tabs" hidden>
    <button data-tab="calendar"><span class="ico">📅</span><span class="lbl"></span></button>
    <button data-tab="clients"><span class="ico">👥</span><span class="lbl"></span></button>
    <button data-tab="stats"><span class="ico">📊</span><span class="lbl"></span></button>
    <button data-tab="settings"><span class="ico">⚙️</span><span class="lbl"></span></button>
  </nav>
  <div id="sheet-wrap" class="sheet-wrap" hidden>
    <div class="sheet-backdrop"></div>
    <section id="sheet" class="sheet" role="dialog" aria-modal="true"></section>
  </div>
  <div id="toast" class="toast" hidden></div>
  <script src="i18n.js"></script>
  <script src="app.js"></script>
</body>
</html>
